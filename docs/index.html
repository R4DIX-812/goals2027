<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f3eedf">
<meta name="description" content="친구와 함께 쓰는 2027 목표와 버킷리스트.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com https://www.google.com https://www.recaptcha.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.gstatic.com; connect-src 'self' https://*.googleapis.com https://*.cloudfunctions.net https://*.run.app https://*.firebaseio.com wss://*.firebaseio.com https://www.gstatic.com https://www.google.com https://www.recaptcha.net; frame-src https://*.firebaseapp.com https://accounts.google.com https://www.google.com https://www.recaptcha.net; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>2027 버킷리스트</title>
<link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./style.css?v=20261116-rename">
<script type="module" src="./app.js?v=20261116-rename"></script>
</head>
<body>
<a href="#main" class="skip">본문으로 건너뛰기</a>
<div id="app" aria-busy="true"><p class="loading">버킷리스트를 불러오고 있어요…</p></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<dialog id="editor" aria-labelledby="editor-title">
<form id="edit-form">
<div class="dialog-head"><span class="eyebrow" id="editor-title">A LITTLE NOTE FOR 2027</span><button type="button" class="icon-btn" data-action="close-editor" aria-label="기록 닫기">×</button></div>
<div class="segmented"><label><input type="radio" name="kind" value="goal" checked>올해의 목표</label><label><input type="radio" name="kind" value="bucket">버킷리스트</label></div>
<label class="field">어떤 2027년을 꿈꾸나요?<input name="title" maxlength="80" required placeholder="예: 한 달에 한 번, 새로운 곳으로" autocomplete="off"></label>
<label class="field">작은 메모 <span class="optional">선택</span><textarea name="note" maxlength="500" rows="4" placeholder="시작할 작은 한 걸음이나, 함께하고 싶은 이유를 적어 보세요."></textarea></label>
<div class="decorate"><fieldset><legend>종이 색</legend><label class="swatch paper"><input type="radio" name="color" value="paper" checked aria-label="화이트"></label><label class="swatch pink"><input type="radio" name="color" value="pink" aria-label="연한 핑크"></label><label class="swatch green"><input type="radio" name="color" value="green" aria-label="크리미한 녹색"></label></fieldset>
<fieldset><legend>작은 스티커</legend><label class="sticker-choice"><input type="radio" name="sticker" value="" checked aria-label="스티커 없음"><span>―</span></label><label class="sticker-choice"><input type="radio" name="sticker" value="star" aria-label="별"><span>✦</span></label><label class="sticker-choice"><input type="radio" name="sticker" value="flower" aria-label="꽃"><span>✿</span></label><label class="sticker-choice"><input type="radio" name="sticker" value="clover" aria-label="클로버"><span>♧</span></label></fieldset></div>
<p class="form-hint">입력한 내용은 자동 저장되어 친구에게도 보여요.</p>
<div id="save-status" class="save-status" role="status" aria-live="polite"></div>
<div id="conflict" hidden><p>다른 기기에서 바뀐 내용이 있어요. 내 초안은 위에 그대로 남아 있어요.</p><pre id="latest-content"></pre><button type="button" data-action="use-latest" class="btn secondary">최신 내용 불러오기</button><button type="button" data-action="keep-draft" class="btn secondary">내 초안으로 저장</button></div>
<div class="dialog-footer"><button type="button" class="text-btn danger" data-action="delete-item">기록 삭제</button><div><button type="button" class="text-btn" id="retry-save" data-action="retry-save" hidden>다시 저장</button><button type="submit" class="btn primary">저장하고 닫기 ↗</button></div></div>
</form>
</dialog>
<dialog id="rename-room" aria-labelledby="rename-room-title">
  <form id="rename-room-form">
    <h2 id="rename-room-title">버킷리스트 이름 수정</h2>
    <label class="field">새 이름<input name="title" maxlength="40" required autocomplete="off" autofocus></label>
    <p class="error" role="alert"></p>
    <div class="dialog-footer">
      <button type="button" class="btn secondary" data-action="close-rename-room">취소</button>
      <button type="submit" class="btn primary">저장</button>
    </div>
  </form>
</dialog>
<dialog id="confirm" aria-labelledby="confirm-title"><h2 id="confirm-title">기록을 지울까요?</h2><p id="confirm-text"></p><div class="dialog-footer"><button class="btn secondary" data-confirm="false">취소</button><button class="btn primary" data-confirm="true">확인</button></div></dialog>
</body>
</html>
